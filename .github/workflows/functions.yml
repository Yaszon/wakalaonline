name: Firebase Functions (oda za Rial – ClickPesa)

# Deploys ONLY the "rial" codebase to Firebase project "yaszone".
# Other functions in the project (e.g. the Whisper voice-note function) are not touched or deleted.
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/functions.yml'
  workflow_dispatch:
    inputs:
      update_secrets:
        description: 'Weka/badilisha funguo za ClickPesa kwenye Firebase (kutoka GitHub secrets)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firebase-functions
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions

      - name: Hakikisha secret ya Google ipo
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YASZONE }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Weka GitHub secret FIREBASE_SERVICE_ACCOUNT_YASZONE kwanza (tazama functions/SOMA-KWANZA.md)."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YASZONE }}

      - name: Weka funguo za ClickPesa (ukichagua update_secrets)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_secrets }}
        env:
          CLICKPESA_CLIENT_ID: ${{ secrets.CLICKPESA_CLIENT_ID }}
          CLICKPESA_API_KEY: ${{ secrets.CLICKPESA_API_KEY }}
          CLICKPESA_CHECKSUM_KEY: ${{ secrets.CLICKPESA_CHECKSUM_KEY }}
        run: |
          for name in CLICKPESA_CLIENT_ID CLICKPESA_API_KEY CLICKPESA_CHECKSUM_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then echo "::error::GitHub secret $name haipo"; exit 1; fi
            printf '%s' "$value" | npx --yes firebase-tools@13 functions:secrets:set "$name" --data-file - --project yaszone --force --non-interactive
          done

      - name: Deploy (codebase "rial" tu)
        run: npx --yes firebase-tools@13 deploy --only functions:rial --project yaszone --force --non-interactive
